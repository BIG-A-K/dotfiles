# venus — starship venus（#D85E33 のテラコッタ + #DCBA92 のサンド）
#
# tmux.conf から source-file される色定義。tmux.conf 単体でも動くように、
# ここでは配色に関する設定だけを上書きする。
# 生成元のパレットは starship.conf/venus.toml を参照。
#
#   accent  #D85E33  starship の左端バッジ色。セッション名・時計・アクティブペイン枠
#   dir     #DCBA92  $directory の色。アクティブウィンドウ
#   git     #394260  $git_branch の背景。右側のホスト名ブロック
#   lang    #212736  言語セグメントの背景。非アクティブペイン枠
#   bar     #1d2230  ステータスバーの背景
#   text    #a0a9cb  通常の文字 / muted #6b7390  非アクティブの文字

# ステータスバー本体
set -g status-style "fg=#a0a9cb,bg=#1d2230"

# 左: セッション名を starship の左端バッジと同じ色にして powerline 区切りで繋ぐ
set -g status-left "#[fg=#ffffff,bg=#D85E33,bold] #S #[fg=#D85E33,bg=#1d2230,nobold]"
set -g status-left-length 40

# 右: ホスト名:ユーザー名（git セグメント色）＋ 日付(曜日) 時刻（アクセント色）
set -g status-right "#[fg=#394260,bg=#1d2230]#[fg=#a0a9cb,bg=#394260] #h:#(whoami) #[fg=#D85E33,bg=#394260]#[fg=#ffffff,bg=#D85E33,bold] %Y-%m-%d(%a) %H:%M "
set -g status-right-length 60

# ウィンドウ一覧: 非アクティブは沈ませ、アクティブだけ $directory の色で浮かせる
set -g window-status-separator ""
setw -g window-status-format "#[fg=#6b7390,bg=#1d2230] #I:#W#F "
setw -g window-status-current-format "#[fg=#DCBA92,bg=#1d2230]#[fg=#3b2a1c,bg=#DCBA92,bold] #I:#W#F #[fg=#DCBA92,bg=#1d2230,nobold]"
setw -g window-status-activity-style "fg=#DCBA92,bg=#1d2230"
setw -g window-status-bell-style "fg=#D85E33,bg=#1d2230,bold"

# ペイン枠。アクティブなペインだけアクセント色にする
set -g pane-border-style "fg=#212736"
set -g pane-active-border-style "fg=#D85E33"
set -g pane-border-format "#[fg=#6b7390]#{?pane_active,#[fg=#D85E33#,bold],}#{pane_index}#[fg=#6b7390,nobold]:#{pane_current_command} "

# コマンドライン（display-message / confirm-before の表示）
set -g message-style "fg=#ffffff,bg=#D85E33,bold"
set -g message-command-style "fg=#D85E33,bg=#394260"

# コピーモードの選択範囲と検索マッチ
set -g mode-style "fg=#3b2a1c,bg=#DCBA92"
set -g copy-mode-match-style "fg=#1d2230,bg=#a0a9cb"
set -g copy-mode-current-match-style "fg=#ffffff,bg=#D85E33,bold"

# prefix + q のペイン番号表示、prefix + t の時計
set -g display-panes-colour "#6b7390"
set -g display-panes-active-colour "#D85E33"
setw -g clock-mode-colour "#D85E33"
