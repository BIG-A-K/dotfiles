# jupiter — starship jupiter（#FFA759 のオレンジ + #73D0FF のシアン。ayu系の明るいパレット）
#
# tmux.conf から source-file される色定義。tmux.conf 単体でも動くように、
# ここでは配色に関する設定だけを上書きする。
# 生成元のパレットは starship.conf/jupiter.toml を参照。
#
#   accent  #FFA759  starship の左端バッジ色。セッション名・時計・アクティブペイン枠
#   dir     #73D0FF  $directory の色。アクティブウィンドウ
#   git     #3E4B59  $git_branch の背景。右側のホスト名ブロック
#   lang    #2D3640  言語セグメントの背景。非アクティブペイン枠
#   bar     #232834  ステータスバーの背景
#   text    #A6ACB9  通常の文字 / muted #5C6773  非アクティブの文字

# ステータスバー本体
set -g status-style "fg=#A6ACB9,bg=#232834"

# 左: セッション名を starship の左端バッジと同じ色にして powerline 区切りで繋ぐ
set -g status-left "#[fg=#1F2430,bg=#FFA759,bold] #S #[fg=#FFA759,bg=#232834,nobold]"
set -g status-left-length 40

# 右: ホスト名:ユーザー名（git セグメント色）＋ 日付(曜日) 時刻（アクセント色）
set -g status-right "#[fg=#3E4B59,bg=#232834]#[fg=#A6ACB9,bg=#3E4B59] #h:#(whoami) #[fg=#FFA759,bg=#3E4B59]#[fg=#1F2430,bg=#FFA759,bold] %Y-%m-%d(%a) %H:%M "
set -g status-right-length 60

# ウィンドウ一覧: 非アクティブは沈ませ、アクティブだけ $directory の色で浮かせる
set -g window-status-separator ""
setw -g window-status-format "#[fg=#5C6773,bg=#232834] #I:#W#F "
setw -g window-status-current-format "#[fg=#73D0FF,bg=#232834]#[fg=#1F2430,bg=#73D0FF,bold] #I:#W#F #[fg=#73D0FF,bg=#232834,nobold]"
setw -g window-status-activity-style "fg=#73D0FF,bg=#232834"
setw -g window-status-bell-style "fg=#FFA759,bg=#232834,bold"

# ペイン枠。アクティブなペインだけアクセント色にする
set -g pane-border-style "fg=#2D3640"
set -g pane-active-border-style "fg=#FFA759"
set -g pane-border-format "#[fg=#5C6773]#{?pane_active,#[fg=#FFA759#,bold],}#{pane_index}#[fg=#5C6773,nobold]:#{pane_current_command} "

# コマンドライン（display-message / confirm-before の表示）
set -g message-style "fg=#1F2430,bg=#FFA759,bold"
set -g message-command-style "fg=#FFA759,bg=#3E4B59"

# コピーモードの選択範囲と検索マッチ
set -g mode-style "fg=#1F2430,bg=#73D0FF"
set -g copy-mode-match-style "fg=#232834,bg=#A6ACB9"
set -g copy-mode-current-match-style "fg=#1F2430,bg=#FFA759,bold"

# prefix + q のペイン番号表示、prefix + t の時計
set -g display-panes-colour "#5C6773"
set -g display-panes-active-colour "#FFA759"
setw -g clock-mode-colour "#FFA759"
