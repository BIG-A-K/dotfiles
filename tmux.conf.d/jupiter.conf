# jupiter — starship jupiter（天上の黄金 / オリュンポス。幸福をもたらす神としての木星）
#
# tmux.conf から source-file される色定義。tmux.conf 単体でも動くように、
# ここでは配色に関する設定だけを上書きする。
# 生成元のパレットは starship.conf/jupiter.toml を参照。
#
#   accent  #F2D98B  月桂冠の黄金・雷霆。セッション名・時計・アクティブペイン枠
#   dir     #EDE7DC  神殿の大理石。$directory の色。アクティブウィンドウ
#   git     #2F3A63  深い天空。$git_branch の背景。右側のホスト名ブロック
#   lang    #232A4A  言語セグメントの背景
#   bar     #161B33  夜天。ステータスバーの背景。明チップに載せる文字色も兼ねる
#   text    #D8DCEA  通常の文字 / muted #8A93B5  非アクティブの文字

# ステータスバー本体
set -g status-style "fg=#D8DCEA,bg=#161B33"

# 左: セッション名を starship の左端バッジと同じ黄金にして powerline 区切りで繋ぐ
set -g status-left "#[fg=#161B33,bg=#F2D98B,bold] #S #[fg=#F2D98B,bg=#161B33,nobold]"
set -g status-left-length 40

# 右: ホスト名:ユーザー名（git セグメント色）＋ 日付(曜日) 時刻（アクセント色）
set -g status-right "#[fg=#2F3A63,bg=#161B33]#[fg=#D8DCEA,bg=#2F3A63] #h:#(whoami) #[fg=#F2D98B,bg=#2F3A63]#[fg=#161B33,bg=#F2D98B,bold] %Y-%m-%d(%a) %H:%M "
set -g status-right-length 60

# ウィンドウ一覧: 非アクティブは沈ませ、アクティブだけ大理石の色で浮かせる
set -g window-status-separator ""
setw -g window-status-format "#[fg=#8A93B5,bg=#161B33] #I:#W#F "
setw -g window-status-current-format "#[fg=#EDE7DC,bg=#161B33]#[fg=#161B33,bg=#EDE7DC,bold] #I:#W#F #[fg=#EDE7DC,bg=#161B33,nobold]"
setw -g window-status-activity-style "fg=#EDE7DC,bg=#161B33"
setw -g window-status-bell-style "fg=#F2D98B,bg=#161B33,bold"

# ペイン枠。アクティブなペインだけアクセント色にする
set -g pane-border-style "fg=#2F3A63"
set -g pane-active-border-style "fg=#F2D98B"
set -g pane-border-format "#[fg=#8A93B5]#{?pane_active,#[fg=#F2D98B#,bold],}#{pane_index}#[fg=#8A93B5,nobold]:#{pane_current_command} "

# コマンドライン（display-message / confirm-before の表示）
set -g message-style "fg=#161B33,bg=#F2D98B,bold"
set -g message-command-style "fg=#F2D98B,bg=#2F3A63"

# コピーモードの選択範囲と検索マッチ
set -g mode-style "fg=#161B33,bg=#EDE7DC"
set -g copy-mode-match-style "fg=#161B33,bg=#D8DCEA"
set -g copy-mode-current-match-style "fg=#161B33,bg=#F2D98B,bold"

# prefix + q のペイン番号表示、prefix + t の時計
set -g display-panes-colour "#8A93B5"
set -g display-panes-active-colour "#F2D98B"
setw -g clock-mode-colour "#F2D98B"
