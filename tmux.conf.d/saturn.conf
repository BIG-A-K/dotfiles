# saturn — starship saturn（#E84545 のクリムゾン + ネイビーダーク背景）
#
# tmux.conf から source-file される色定義。tmux.conf 単体でも動くように、
# ここでは配色に関する設定だけを上書きする。
# 生成元のパレットは starship.conf/saturn.toml を参照。
#
#   accent  #E84545  starship の左端バッジ色。セッション名・時計・アクティブペイン枠
#   dir     #53354A  $directory の色。アクティブウィンドウ
#   git     #2B2E4A  $git_branch の背景。右側のホスト名ブロック
#   lang    #232640  言語セグメントの背景
#   bar     #1B1E33  ステータスバーの背景
#   text    #ABB2BF  通常の文字 / muted #828AA6  非アクティブの文字

# ステータスバー本体
set -g status-style "fg=#ABB2BF,bg=#1B1E33"

# 左: セッション名を starship の左端バッジと同じ色にして powerline 区切りで繋ぐ
set -g status-left "#[fg=#ffffff,bg=#E84545,bold] #S #[fg=#E84545,bg=#1B1E33,nobold]"
set -g status-left-length 40

# 右: ホスト名:ユーザー名（git セグメント色）＋ 日付(曜日) 時刻（アクセント色）
set -g status-right "#[fg=#2B2E4A,bg=#1B1E33]#[fg=#ABB2BF,bg=#2B2E4A] #h:#(whoami) #[fg=#E84545,bg=#2B2E4A]#[fg=#ffffff,bg=#E84545,bold] %Y-%m-%d(%a) %H:%M "
set -g status-right-length 60

# ウィンドウ一覧: 非アクティブは沈ませ、アクティブだけ $directory の色で浮かせる
set -g window-status-separator ""
setw -g window-status-format "#[fg=#828AA6,bg=#1B1E33] #I:#W#F "
setw -g window-status-current-format "#[fg=#53354A,bg=#1B1E33]#[fg=#ffffff,bg=#53354A,bold] #I:#W#F #[fg=#53354A,bg=#1B1E33,nobold]"
setw -g window-status-activity-style "fg=#53354A,bg=#1B1E33"
setw -g window-status-bell-style "fg=#E84545,bg=#1B1E33,bold"

# ペイン枠。アクティブなペインだけアクセント色にする
set -g pane-border-style "fg=#2B2E4A"
set -g pane-active-border-style "fg=#E84545"
set -g pane-border-format "#[fg=#828AA6]#{?pane_active,#[fg=#E84545#,bold],}#{pane_index}#[fg=#828AA6,nobold]:#{pane_current_command} "

# コマンドライン（display-message / confirm-before の表示）
set -g message-style "fg=#ffffff,bg=#E84545,bold"
set -g message-command-style "fg=#E84545,bg=#2B2E4A"

# コピーモードの選択範囲と検索マッチ
set -g mode-style "fg=#ffffff,bg=#53354A"
set -g copy-mode-match-style "fg=#1B1E33,bg=#ABB2BF"
set -g copy-mode-current-match-style "fg=#ffffff,bg=#E84545,bold"

# prefix + q のペイン番号表示、prefix + t の時計
set -g display-panes-colour "#828AA6"
set -g display-panes-active-colour "#E84545"
setw -g clock-mode-colour "#E84545"
