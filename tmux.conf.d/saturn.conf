# saturn — starship saturn（#E6D6A8 のリング色 + 暖色ダーク背景）
#
# tmux.conf から source-file される色定義。tmux.conf 単体でも動くように、
# ここでは配色に関する設定だけを上書きする。
# 生成元のパレットは starship.conf/saturn.toml を参照。
#
#   accent  #E6D6A8  starship の左端バッジ色。セッション名・時計・アクティブペイン枠
#   dir     #B99A5B  $directory の色。アクティブウィンドウ
#   git     #33291C  $git_branch の背景。右側のホスト名ブロック
#   lang    #1F1A13  言語セグメントの背景。非アクティブペイン枠
#   bar     #1F1A13  ステータスバーの背景
#   text    #C9B89A  通常の文字 / muted #7d6a48  非アクティブの文字

# ステータスバー本体
set -g status-style "fg=#C9B89A,bg=#1F1A13"

# 左: セッション名を starship の左端バッジと同じ色にして powerline 区切りで繋ぐ
set -g status-left "#[fg=#262015,bg=#E6D6A8,bold] #S #[fg=#E6D6A8,bg=#1F1A13,nobold]"
set -g status-left-length 40

# 右: ホスト名:ユーザー名（git セグメント色）＋ 日付(曜日) 時刻（アクセント色）
set -g status-right "#[fg=#33291C,bg=#1F1A13]#[fg=#C9B89A,bg=#33291C] #h:#(whoami) #[fg=#E6D6A8,bg=#33291C]#[fg=#262015,bg=#E6D6A8,bold] %Y-%m-%d(%a) %H:%M "
set -g status-right-length 60

# ウィンドウ一覧: 非アクティブは沈ませ、アクティブだけ $directory の色で浮かせる
set -g window-status-separator ""
setw -g window-status-format "#[fg=#7d6a48,bg=#1F1A13] #I:#W#F "
setw -g window-status-current-format "#[fg=#B99A5B,bg=#1F1A13]#[fg=#1F1A13,bg=#B99A5B,bold] #I:#W#F #[fg=#B99A5B,bg=#1F1A13,nobold]"
setw -g window-status-activity-style "fg=#B99A5B,bg=#1F1A13"
setw -g window-status-bell-style "fg=#E6D6A8,bg=#1F1A13,bold"

# ペイン枠。アクティブなペインだけアクセント色にする
set -g pane-border-style "fg=#1F1A13"
set -g pane-active-border-style "fg=#E6D6A8"
set -g pane-border-format "#[fg=#7d6a48]#{?pane_active,#[fg=#E6D6A8#,bold],}#{pane_index}#[fg=#7d6a48,nobold]:#{pane_current_command} "

# コマンドライン（display-message / confirm-before の表示）
set -g message-style "fg=#262015,bg=#E6D6A8,bold"
set -g message-command-style "fg=#E6D6A8,bg=#33291C"

# コピーモードの選択範囲と検索マッチ
set -g mode-style "fg=#1F1A13,bg=#B99A5B"
set -g copy-mode-match-style "fg=#1F1A13,bg=#C9B89A"
set -g copy-mode-current-match-style "fg=#262015,bg=#E6D6A8,bold"

# prefix + q のペイン番号表示、prefix + t の時計
set -g display-panes-colour "#7d6a48"
set -g display-panes-active-colour "#E6D6A8"
setw -g clock-mode-colour "#E6D6A8"
