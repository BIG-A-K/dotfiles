# mercury — starship mercury（Quicksilver / 液体金属のモノクローム）
#
# tmux.conf から source-file される色定義。tmux.conf 単体でも動くように、
# ここでは配色と status-left/right の内容だけを上書きする。
# 生成元のパレットは starship.conf/mercury.toml を参照。
#
#   accent  #D7DEE6  starship の OS バッジ色。セッション名・時計・アクティブペイン枠
#   dir     #9AA3AD  $directory の色。アクティブウィンドウ
#   block   #343A42  git・言語セグメントの背景。ホスト名ブロック・非アクティブペイン枠
#   bar     #16181B  ステータスバーの背景
#   ink     #14161A  明るい背景に載せる文字色
#   text    #C2C8CF  通常の文字 / muted #848B94  非アクティブの文字

# ステータスバー本体
set -g status-style "fg=#C2C8CF,bg=#16181B"

# 左: セッション名を starship の OS バッジと同じ色にして powerline 区切りで繋ぐ
set -g status-left "#[fg=#14161A,bg=#D7DEE6,bold] #S #[fg=#D7DEE6,bg=#16181B,nobold]"
set -g status-left-length 40

# 右: starship から降ろした IP ＋ ホスト名:ユーザー名（block 色）＋ 日付(曜日) 時刻（アクセント色）
set -g status-right "#[fg=#848B94,bg=#16181B] #(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null) #[fg=#343A42,bg=#16181B]#[fg=#C2C8CF,bg=#343A42] #h:#(whoami) #[fg=#D7DEE6,bg=#343A42]#[fg=#14161A,bg=#D7DEE6,bold] %Y-%m-%d(%a) %H:%M "
set -g status-right-length 90

# ウィンドウ一覧: 非アクティブは沈ませ、アクティブだけ $directory の色で浮かせる
set -g window-status-separator ""
setw -g window-status-format "#[fg=#848B94,bg=#16181B] #I:#W#F "
setw -g window-status-current-format "#[fg=#9AA3AD,bg=#16181B]#[fg=#14161A,bg=#9AA3AD,bold] #I:#W#F #[fg=#9AA3AD,bg=#16181B,nobold]"
setw -g window-status-activity-style "fg=#9AA3AD,bg=#16181B"
setw -g window-status-bell-style "fg=#D7DEE6,bg=#16181B,bold"

# ペイン枠。アクティブなペインだけアクセント色にする
set -g pane-border-style "fg=#343A42"
set -g pane-active-border-style "fg=#D7DEE6"
set -g pane-border-format "#[fg=#848B94]#{?pane_active,#[fg=#D7DEE6#,bold],}#{pane_index}#[fg=#848B94,nobold]:#{pane_current_command} "

# コマンドライン（display-message / confirm-before の表示）
set -g message-style "fg=#14161A,bg=#D7DEE6,bold"
set -g message-command-style "fg=#D7DEE6,bg=#343A42"

# コピーモードの選択範囲と検索マッチ
set -g mode-style "fg=#14161A,bg=#9AA3AD"
set -g copy-mode-match-style "fg=#16181B,bg=#C2C8CF"
set -g copy-mode-current-match-style "fg=#14161A,bg=#D7DEE6,bold"

# prefix + q のペイン番号表示、prefix + t の時計
set -g display-panes-colour "#848B94"
set -g display-panes-active-colour "#D7DEE6"
setw -g clock-mode-colour "#D7DEE6"
