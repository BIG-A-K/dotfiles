format = """
[░▒▓](#E84545)\
$os\
[](fg:#E84545)\
[ ](fg:#903749)\
$username\
$hostname\
[](fg:#903749)\
[ ](fg:#53354A)\
$directory\
[](fg:#53354A bg:#2B2E4A)\
$git_branch\
$git_status\
[](fg:#2B2E4A bg:#232640)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#232640 bg:#1B1E33)\
$time\
[ ](fg:#1B1E33)\
\n$character
"""

[username]
style_user = "fg:#ffffff bg:#903749"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
style = "fg:#ffffff bg:#903749"
format = "[@$hostname]($style)"

[directory]
style = "fg:#ffffff bg:#53354A"
read_only = ''
format = '[ $path ]($style)[$read_only]($style)'
truncation_length = 0
truncate_to_repo = false
use_os_path_sep = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#2B2E4A"
format = '[[ $symbol $branch ](fg:#98C379 bg:#2B2E4A)]($style)'

[git_status]
style = "bg:#2B2E4A"
format = '[[($all_status$ahead_behind )](fg:#98C379 bg:#2B2E4A)]($style)'

[nodejs]
symbol = ""
style = "bg:#232640"
format = '[[ $symbol ($version) ](fg:#D19A66 bg:#232640)]($style)'

[rust]
symbol = ""
style = "bg:#232640"
format = '[[ $symbol ($version) ](fg:#D19A66 bg:#232640)]($style)'

[golang]
symbol = ""
style = "bg:#232640"
format = '[[ $symbol ($version) ](fg:#D19A66 bg:#232640)]($style)'

[php]
symbol = ""
style = "bg:#232640"
format = '[[ $symbol ($version) ](fg:#D19A66 bg:#232640)]($style)'

[time]
disabled = false
time_format = "%T"
style = "bg:#1B1E33"
format = '[[  $time ](fg:#ABB2BF bg:#1B1E33)]($style)'

[localip]
style = "fg:#ffffff bg:#53354A"
ssh_only = false
format = '[[ $localipv4 ](fg:#53354A bg:#1B1E33)]($style)'
disabled = false

[os]
disabled = false
style = "bg:#E84545 fg:#ffffff"


[os.symbols]
Windows = " 󰍲 "
Ubuntu = " 󰕈 "
SUSE = "  "
Raspbian = " 󰐿 "
Mint = " 󰣭 "
Macos = " 󰀵 "
Manjaro = "  "
Linux = " 󰌽 "
Gentoo = " 󰣨 "
Fedora = " 󰣛 "
Alpine = "  "
Amazon = "  "
Android = "  "
Arch = " 󰣇 "
Artix = " 󰣇 "
EndeavourOS = "  "
CentOS = "  "
Debian = " 󰣚 "
Redhat = " 󱄛 "
RedHatEnterprise = " 󱄛 "
Pop = "  "
