"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:#D7DEE6)\
$os\
$hostname\
[](fg:#D7DEE6)\
[ ](fg:#9AA3AD)\
$directory\
[](fg:#9AA3AD bg:#343A42)\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$php\
[](fg:#343A42)\
\n$character
"""

[os]
disabled = false
style = "fg:#14161A bg:#D7DEE6"

[hostname]
ssh_only = true
style = "fg:#14161A bg:#D7DEE6"
format = "[@$hostname ]($style)"

[username]
disabled = true

[directory]
style = "fg:#14161A bg:#9AA3AD"
read_only = ''
format = '[ $path ]($style)[$read_only]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false
use_os_path_sep = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#343A42"
format = '[[ $symbol $branch ](fg:#C2C8CF bg:#343A42)]($style)'

[git_status]
style = "bg:#343A42"
format = '[[($all_status$ahead_behind )](fg:#C2C8CF bg:#343A42)]($style)'

[nodejs]
symbol = ""
style = "bg:#343A42"
format = '[[ $symbol ($version) ](fg:#A6AFB9 bg:#343A42)]($style)'

[rust]
symbol = ""
style = "bg:#343A42"
format = '[[ $symbol ($version) ](fg:#A6AFB9 bg:#343A42)]($style)'

[golang]
symbol = ""
style = "bg:#343A42"
format = '[[ $symbol ($version) ](fg:#A6AFB9 bg:#343A42)]($style)'

[php]
symbol = ""
style = "bg:#343A42"
format = '[[ $symbol ($version) ](fg:#A6AFB9 bg:#343A42)]($style)'

[time]
disabled = true

[localip]
disabled = true

[os.symbols]
Windows = " 󰍲 "
Ubuntu = " 󰕈 "
SUSE = "  "
Raspbian = " 󰐿 "
Mint = " 󰣭 "
Macos = " 󰀵 "
Manjaro = "  "
Linux = " 󰌽 "
Gentoo = " 󰣨 "
Fedora = " 󰣛 "
Alpine = "  "
Amazon = "  "
Android = "  "
Arch = " 󰣇 "
Artix = " 󰣇 "
EndeavourOS = "  "
CentOS = "  "
Debian = " 󰣚 "
Redhat = " 󱄛 "
RedHatEnterprise = " 󱄛 "
Pop = "  "
