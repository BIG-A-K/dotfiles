format = """
[](fg:#F2D98B)\
$os\
[](fg:#F2D98B)\
[ ](fg:#5A6BA8)\
$username\
$hostname\
[](fg:#5A6BA8)\
[ ](fg:#EDE7DC)\
$directory\
[](fg:#EDE7DC bg:#2F3A63)\
$git_branch\
$git_status\
[](fg:#2F3A63 bg:#232A4A)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#232A4A bg:#161B33)\
$time\
[ ](fg:#161B33)\
\n$character
"""

[username]
style_user = "fg:#F2EFFA bg:#5A6BA8"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
style = "fg:#F2EFFA bg:#5A6BA8"
format = "[@$hostname]($style)"

[directory]
style = "fg:#161B33 bg:#EDE7DC"
read_only = ''
format = '[ $path ]($style)[$read_only]($style)'
truncation_length = 0
truncate_to_repo = false
use_os_path_sep = true


[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#2F3A63"
format = '[[ $symbol $branch ](fg:#D8DCEA bg:#2F3A63)]($style)'

[git_status]
style = "bg:#2F3A63"
format = '[[($all_status$ahead_behind )](fg:#D8DCEA bg:#2F3A63)]($style)'

[nodejs]
symbol = ""
style = "bg:#232A4A"
format = '[[ $symbol ($version) ](fg:#C9B88A bg:#232A4A)]($style)'

[rust]
symbol = ""
style = "bg:#232A4A"
format = '[[ $symbol ($version) ](fg:#C9B88A bg:#232A4A)]($style)'

[golang]
symbol = ""
style = "bg:#232A4A"
format = '[[ $symbol ($version) ](fg:#C9B88A bg:#232A4A)]($style)'

[php]
symbol = ""
style = "bg:#232A4A"
format = '[[ $symbol ($version) ](fg:#C9B88A bg:#232A4A)]($style)'

[time]
disabled = false
time_format = "%T"
style = "bg:#161B33"
format = '[[  $time ](fg:#D8DCEA bg:#161B33)]($style)'

[localip]
style = "fg:#F2EFFA bg:#5A6BA8"
ssh_only = false
format = '[[ $localipv4 ](fg:#8A93B5 bg:#161B33)]($style)'
disabled = false

[os]
disabled = false
style = "bg:#F2D98B fg:#161B33"


[os.symbols]
Windows = " 󰍲 "
Ubuntu = " 󰕈 "
SUSE = "  "
Raspbian = " 󰐿 "
Mint = " 󰣭 "
Macos = " 󰀵 "
Manjaro = "  "
Linux = " 󰌽 "
Gentoo = " 󰣨 "
Fedora = " 󰣛 "
Alpine = "  "
Amazon = "  "
Android = "  "
Arch = " 󰣇 "
Artix = " 󰣇 "
EndeavourOS = "  "
CentOS = "  "
Debian = " 󰣚 "
Redhat = " 󱄛 "
RedHatEnterprise = " 󱄛 "
Pop = "  "
