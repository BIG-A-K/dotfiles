format = """
[](fg:#FF8F40)\
$os\
[](fg:#FF8F40)\
[ ](fg:#E6B450)\
$username\
$hostname\
[](fg:#E6B450)\
[ ](fg:#39BAE6)\
$directory\
[](fg:#39BAE6 bg:#1C2028)\
$git_branch\
$git_status\
[](fg:#1C2028 bg:#11151C)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#11151C bg:#0D1017)\
$time\
[ ](fg:#0D1017)\
\n$character
"""

[username]
style_user = "fg:#ffffff bg:#E6B450"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
style = "fg:#ffffff bg:#E6B450"
format = "[@$hostname]($style)"

[directory]
style = "fg:#ffffff bg:#39BAE6"
read_only = ''
format = '[ $path ]($style)[$read_only]($style)'
truncation_length = 0
truncate_to_repo = false
use_os_path_sep = true


[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#1C2028"
format = '[[ $symbol $branch ](fg:#AAD94C bg:#1C2028)]($style)'

[git_status]
style = "bg:#1C2028"
format = '[[($all_status$ahead_behind )](fg:#AAD94C bg:#1C2028)]($style)'

[nodejs]
symbol = ""
style = "bg:#11151C"
format = '[[ $symbol ($version) ](fg:#FFB454 bg:#11151C)]($style)'

[rust]
symbol = ""
style = "bg:#11151C"
format = '[[ $symbol ($version) ](fg:#FFB454 bg:#11151C)]($style)'

[golang]
symbol = ""
style = "bg:#11151C"
format = '[[ $symbol ($version) ](fg:#FFB454 bg:#11151C)]($style)'

[php]
symbol = ""
style = "bg:#11151C"
format = '[[ $symbol ($version) ](fg:#FFB454 bg:#11151C)]($style)'

[time]
disabled = false
time_format = "%T"
style = "bg:#0D1017"
format = '[[  $time ](fg:#ACB6BF bg:#0D1017)]($style)'

[localip]
style = "fg:#ffffff bg:#E6B450"
ssh_only = false
format = '[[ $localipv4 ](fg:#E6B450 bg:#0D1017)]($style)'
disabled = false

[os]
disabled = false
style = "bg:#FF8F40 fg:#ffffff"


[os.symbols]
Windows = " 󰍲 "
Ubuntu = " 󰕈 "
SUSE = "  "
Raspbian = " 󰐿 "
Mint = " 󰣭 "
Macos = " 󰀵 "
Manjaro = "  "
Linux = " 󰌽 "
Gentoo = " 󰣨 "
Fedora = " 󰣛 "
Alpine = "  "
Amazon = "  "
Android = "  "
Arch = " 󰣇 "
Artix = " 󰣇 "
EndeavourOS = "  "
CentOS = "  "
Debian = " 󰣚 "
Redhat = " 󱄛 "
RedHatEnterprise = " 󱄛 "
Pop = "  "
